# Build args of podman/Containerfile.kide, passed with
#   podman build --build-arg-file podman/base.conf …
# Replace this file to build on another RHEL9-compatible base; the image has
# to provide the packages the Containerfile installs, after $CONF_DIR/repos.sh.
#
# BASE: base image (of both of Containerfile.kide's stages). For kide on top
# of the ibn-dev build environment (separate repo), override it:
# --build-arg BASE=localhost/ibn-dev
BASE=docker.io/rockylinux/rockylinux:9
# CONF_DIR: directory (relative to the build context, the repo root) with the
# files copied into the image:
#   repos.sh    -> run as root in every stage before any dnf install (repo setup)
#   ubi.repo    -> /etc/yum.repos.d/ (every stage, before any dnf install)
# podman/conf holds an empty ubi.repo; replace it with the real one on prod.
CONF_DIR=podman/conf
# KIDE_USER: the user the image runs as (every install step runs as root).
# If the base image already has this user (e.g. "default", uid 1001, in Red
# Hat's application images, or ibn-dev's), it is used as is and
# KIDE_UID/KIDE_GID must be its uid/gid; otherwise it is created with them.
# Keep them the same as in ibn-dev's base.conf. `podman run` maps you on the
# host to it: --userns=keep-id:uid=<KIDE_UID>,gid=<KIDE_GID>.
KIDE_USER=default
KIDE_UID=1001
KIDE_GID=1001
