# GitHub Release for a pushed tag v<version> (e.g. v0.1.0), created here in CI
# with the workflow's own token: releasing needs only `git push origin <tag>`.
# Notes: release-notes/<tag>.md at the tagged commit; missing -> the commit
# subjects since the previous v* tag. Assets: kide-<version>.tar.gz (git
# archive of the tagged commit, unpacks to kide-<version>/; the offline install
# tarball) + its .sha256. A release that already exists (tag moved) gets its
# notes and assets replaced and is published again (deleting its tag turned it
# into a draft).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the release
        run: |
          tag="$GITHUB_REF_NAME"
          notes="release-notes/$tag.md"
          if [ ! -f "$notes" ]; then
            prev=$(git describe --tags --abbrev=0 --match 'v*' "$tag^" 2>/dev/null || true)
            notes=notes.md
            {
              echo "Changes${prev:+ since $prev}:"
              git log --format='- %s (%h)' ${prev:+$prev..}"$tag"
            } > "$notes"
          fi
          version="${tag#v}"
          mkdir -p out
          git archive --format=tar.gz --prefix="kide-$version/" -o "out/kide-$version.tar.gz" "$tag"
          (cd out && sha256sum "kide-$version.tar.gz" > "kide-$version.tar.gz.sha256")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "kide $version" --notes-file "$notes" --draft=false
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* --title "kide $version" --notes-file "$notes" --verify-tag
          fi
